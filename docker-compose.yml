services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: enterprise-rag-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enterprise_rag} -d ${POSTGRES_DB:-enterprise_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: enterprise-rag-api
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - ./logs:/app/logs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Enterprise RAG Knowledge Assistant}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: ${LOG_FILE:-/app/logs/app.log}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_rag}
      POSTGRES_USER: ${POSTGRES_USER:-enterprise_rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-2}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-5}
      RETRIEVAL_SIMILARITY_THRESHOLD: ${RETRIEVAL_SIMILARITY_THRESHOLD:-0.0}
      HYBRID_VECTOR_WEIGHT: ${HYBRID_VECTOR_WEIGHT:-0.7}
      HYBRID_KEYWORD_WEIGHT: ${HYBRID_KEYWORD_WEIGHT:-0.3}
      HYBRID_CANDIDATE_MULTIPLIER: ${HYBRID_CANDIDATE_MULTIPLIER:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-20000}
      QUERY_REWRITE_ENABLED: ${QUERY_REWRITE_ENABLED:-true}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-gpt-4o-mini}
      CONVERSATION_MEMORY_ENABLED: ${CONVERSATION_MEMORY_ENABLED:-false}
      CONVERSATION_REWRITE_ENABLED: ${CONVERSATION_REWRITE_ENABLED:-false}
      CONVERSATION_MAX_MESSAGES: ${CONVERSATION_MAX_MESSAGES:-20}
      RAG_RELEVANCE_THRESHOLD: ${RAG_RELEVANCE_THRESHOLD:-0.70}
      EVAL_LLM_PROVIDER: ${EVAL_LLM_PROVIDER:-openai}
      EVAL_LLM_MODEL: ${EVAL_LLM_MODEL:-gpt-4o-mini}
      EVAL_LLM_API_KEY: ${EVAL_LLM_API_KEY:-}
      EVAL_LLM_BASE_URL: ${EVAL_LLM_BASE_URL:-}
      EVAL_FAITHFULNESS_THRESHOLD: ${EVAL_FAITHFULNESS_THRESHOLD:-0.70}
      EVAL_ANSWER_RELEVANCY_THRESHOLD: ${EVAL_ANSWER_RELEVANCY_THRESHOLD:-0.70}
      EVAL_CONTEXT_RELEVANCY_THRESHOLD: ${EVAL_CONTEXT_RELEVANCY_THRESHOLD:-0.70}
      EVAL_CONTEXT_PRECISION_THRESHOLD: ${EVAL_CONTEXT_PRECISION_THRESHOLD:-0.70}
      EVAL_CONTEXT_RECALL_THRESHOLD: ${EVAL_CONTEXT_RECALL_THRESHOLD:-0.70}
      EVAL_SAFETY_THRESHOLD: ${EVAL_SAFETY_THRESHOLD:-0.70}
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-enterprise-rag}
      API_KEY: ${API_KEY:-}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["*"]}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  postgres_data:
